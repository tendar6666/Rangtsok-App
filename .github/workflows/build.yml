name: Build and Release Rangtsok App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run automated test suite
        run: python tests/run_all_tests.py

      - name: Build Windows executable with PyInstaller
        run: python -m PyInstaller --clean -y Rangtsok_app.spec

      - name: Generate User Manual PDF
        run: python generate_manual.py

      - name: Verify executable version metadata
        shell: pwsh
        run: |
          $info = (Get-Item "dist\Rangtsok_app.exe").VersionInfo
          Write-Host "ProductName     :" $info.ProductName
          Write-Host "FileDescription :" $info.FileDescription
          Write-Host "FileVersion     :" $info.FileVersion
          Write-Host "CompanyName     :" $info.CompanyName
          Write-Host "LegalCopyright  :" $info.LegalCopyright

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rangtsok-app-windows
          path: |
            dist/Rangtsok_app.exe
            User_Manual.pdf
          retention-days: 30

      - name: Publish GitHub Release (on version tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Rangtsok_app.exe
            User_Manual.pdf
          generate_release_notes: true
          make_latest: true
