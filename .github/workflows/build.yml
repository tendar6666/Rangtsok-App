name: Build and Test Rangtsok App

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run automated test suite
        run: python tests/run_all_tests.py

      - name: Build Windows executable with PyInstaller
        run: python -m PyInstaller --clean -y Rangtsok_app.spec

      - name: Generate User Manual PDF
        run: python generate_manual.py

      - name: Verify executable version metadata
        shell: pwsh
        run: |
          $info = (Get-Item "dist\Rangtsok_app.exe").VersionInfo
          Write-Host "ProductName     :" $info.ProductName
          Write-Host "FileDescription :" $info.FileDescription
          Write-Host "FileVersion     :" $info.FileVersion
          Write-Host "CompanyName     :" $info.CompanyName
          Write-Host "LegalCopyright  :" $info.LegalCopyright

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rangtsok-app-windows
          path: |
            dist/Rangtsok_app.exe
            User_Manual.pdf
          retention-days: 30
